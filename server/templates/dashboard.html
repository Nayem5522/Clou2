<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h2>🔗 Link Dashboard</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <a class="btn btn-ghost" href="/deleted">🗑 Deleted Links</a>
          <a class="btn btn-ghost" href="/logout">Logout</a>
        </div>
      </div>

      <form id="addLinkForm" class="card" style="margin-bottom:12px;">
        <label for="urlInput" class="text-muted" style="font-size:13px;margin-bottom:6px;">Enter download URL</label>
        <input id="urlInput" type="url" name="url" placeholder="https://drive.google.com/..." required>
        <label for="filenameInput" class="text-muted" style="font-size:13px;margin-top:8px;">Custom filename (optional)</label>
        <input id="filenameInput" type="text" name="filename" placeholder="example-file.zip">
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button type="submit" class="btn btn-primary">Add Link</button>
          <button type="reset" class="btn btn-ghost">Reset</button>
        </div>
        <p id="formStatus" class="status"></p>
      </form>

      <h3 style="margin:6px 0 12px 0;">🗂 Added Links</h3>
      <ul id="linkList" class="file-list">
        {% for link in links %}
        <li class="file-item" id="link-{{ link._id }}">
          <div class="file-info">
            <div style="font-weight:700;">{{ link.filename }}</div>
            <div class="file-meta">Added: {{ link.added_at }} • {{ link.original_url }}</div>
          </div>

          <div class="file-actions">
            <a class="btn btn-ghost" href="/download/{{ link._id }}">View</a>
            <a class="btn btn-ghost" target="_blank" href="{{ link.original_url }}">Original</a>
            <form action="/delete/{{ link._id }}" method="POST" style="display:inline;">
              <button type="submit" class="btn btn-ghost">Delete</button>
            </form>
          </div>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>

  <script>
    document.getElementById('addLinkForm').addEventListener('submit', function(e){
      e.preventDefault();
      const urlInput = document.getElementById('urlInput');
      const filenameInput = document.getElementById('filenameInput');
      const formStatus = document.getElementById('formStatus');

      const url = urlInput.value.trim();
      const filename = filenameInput.value.trim();

      if (!url) { formStatus.textContent = 'Please enter a URL.'; formStatus.style.color='red'; return; }

      formStatus.textContent = 'Adding link...';
      formStatus.style.color = '#333';

      fetch('/api/add_link', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url, filename})
      })
      .then(r=>r.json())
      .then(data=>{
        if (data.status==='success'){
          formStatus.innerHTML = `✅ Link for <strong>${data.link.filename}</strong> added successfully!`;
          formStatus.style.color='green';
          // prepend new link
          const linkList = document.getElementById('linkList');
          const newLink = data.link;
          const li = document.createElement('li');
          li.className='file-item'; li.id=`link-${newLink._id}`;
          li.innerHTML = `
            <div class="file-info">
              <div style="font-weight:700;">${newLink.filename}</div>
              <div class="file-meta">Just now • ${url}</div>
            </div>
            <div class="file-actions">
              <a class="btn btn-ghost" href="/download/${newLink._id}">View</a>
              <a class="btn btn-ghost" target="_blank" href="${url}">Original</a>
              <form action="/delete/${newLink._id}" method="POST" style="display:inline;"><button type="submit" class="btn btn-ghost">Delete</button></form>
            </div>
          `;
          linkList.prepend(li);
          document.getElementById('addLinkForm').reset();
        } else {
          formStatus.textContent = `❌ Failed: ${data.message || 'Unknown error'}`; formStatus.style.color='red';
        }
      })
      .catch(err=>{ formStatus.textContent='❌ An error occurred while adding the link.'; formStatus.style.color='red'; console.error(err); });
    });
  </script>
</body>
</html>
