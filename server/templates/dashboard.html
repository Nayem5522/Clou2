<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { font-family: sans-serif; }
    .container { width: 80%; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2, h3 { text-align: center; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    li:last-child { border-bottom: none; }
    .file-actions form { display: inline; }
    .file-actions a, .file-actions button { text-decoration: none; padding: 5px 10px; border-radius: 5px; color: white; margin-left: 5px; }
    .view-btn { background: #007bff; }
    .direct-btn { background: #28a745; }
    .delete-btn { background: #dc3545; border: none; cursor: pointer; font-size: 14px; }
    .progress-container { width: 100%; background-color: #f3f3f3; border-radius: 5px; margin-top: 10px; display: none; }
    .progress-bar { width: 0%; height: 20px; background-color: #4caf50; border-radius: 5px; text-align: center; line-height: 20px; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📁 File Dashboard</h2>
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="file" id="fileInput" required>
      <button type="submit">Upload</button>
    </form>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
    <p id="uploadStatus"></p>

    <h3>🗂 Uploaded Files</h3>
    <ul>
      {% for f in files %}
        <li>
          <span>{{ f.filename }} - {{ "%.2f"|format(f.size / 1024) }} KB</span>
          <div class="file-actions">
            <a href="/download/{{ f._id }}" class="view-btn">View</a>
            <a href="/direct/{{ f._id }}" class="direct-btn">Direct</a>
            <form action="/delete/{{ f._id }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this file?');">
              <button type="submit" class="delete-btn">Delete</button>
            </form>
          </div>
        </li>
      {% endfor %}
    </ul>

    <a href="/logout" style="float: right; margin-top: 20px;"><button>Logout</button></a>
  </div>

  <script>
    const uploadForm = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const uploadStatus = document.getElementById('uploadStatus');

    uploadForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      const xhr = new XMLHttpRequest();

      xhr.upload.addEventListener('progress', function(e) {
        if (e.lengthComputable) {
          const percentComplete = Math.round((e.loaded / e.total) * 100);
          progressContainer.style.display = 'block';
          progressBar.style.width = percentComplete + '%';
          progressBar.textContent = percentComplete + '%';
        }
      });

      xhr.addEventListener('load', function() {
        if (xhr.status === 200) {
          uploadStatus.textContent = '✅ Upload complete! Refreshing page...';
          setTimeout(() => window.location.reload(), 1500);
        } else {
          uploadStatus.textContent = '❌ Upload failed. Please try again.';
        }
      });

      xhr.addEventListener('error', function() {
        uploadStatus.textContent = '❌ An error occurred during the upload.';
      });

      xhr.open('POST', '/api/upload', true);
      xhr.send(formData);
    });
  </script>
</body>
              </html>
