<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <title>Deleted Links</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h2>🗑 Deleted Links</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <a class="btn btn-ghost" href="/dashboard">⬅ Back</a>
        </div>
      </div>

      <ul class="file-list">
        {% for link in links %}
        <li class="file-item">
          <div class="file-info">
            <div style="font-weight:700;">{{ link.filename }}</div>
            <div class="file-meta">Deleted: {{ link.added_at }} • {{ link.original_url }}</div>
          </div>
          <div class="file-actions">
            <form action="/restore/{{ link._id }}" method="POST" style="display:inline;">
              <button type="submit" class="btn btn-primary">Restore</button>
            </form>
          </div>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</body>
              </html>
