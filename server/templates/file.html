<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8" />
    <title>{{ link_info.filename }}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="file-page">
    <div class="file-card card">
      <h2 style="margin:0 0 8px 0;">{{ link_info.filename }}</h2>
      <div class="text-muted" style="margin-bottom:12px;">Size: {{ link_info.get('size','Unknown') }} • Source: {{ link_info.original_url }}</div>

      <div id="timer-ui">
        <div id="timer-countdown">5</div>
        <div class="text-muted">seconds remaining before download</div>
      </div>

      <div id="success-message" style="display:none; margin-top:12px;">
        <div class="success">✅ Ready to download</div>
      </div>

      <div id="button-container" style="display:none; margin-top:14px;">
        <button class="action-btn btn-primary" id="downloadBtn">⬇️ Download Now</button>
      </div>

      <div class="ad-container" id="footer-ad" style="margin-top:18px;">{{ ads.footer_ad|safe }}</div>

      <footer style="margin-top:12px; font-size:13px; color:#777;">© {{ current_year }} - All rights reserved</footer>
    </div>
  </div>

  <script>
    const FINAL_DOWNLOAD_LINK = {{ ("'" + final_download_link + "'") if final_download_link else "null" }};
    (function(){
      let timer = 5;
      const countdownElement = document.getElementById('timer-countdown');
      const timerUi = document.getElementById('timer-ui');
      const successMessage = document.getElementById('success-message');
      const buttonContainer = document.getElementById('button-container');
      const downloadBtn = document.getElementById('downloadBtn');
      countdownElement.textContent = timer;
      const interval = setInterval(() => {
        timer--;
        countdownElement.textContent = timer;
        if (timer <= 0) {
          clearInterval(interval);
          timerUi.style.display = 'none';
          successMessage.style.display = 'block';
          buttonContainer.style.display = 'block';
        }
      }, 1000);

      downloadBtn.addEventListener('click', function(){
        if (!FINAL_DOWNLOAD_LINK) { alert('Download link is not available.'); return; }
        const newTab = window.open(FINAL_DOWNLOAD_LINK, '_blank');
        if (!newTab) { alert('Please allow popups for this site to open your download link.'); }
      });
    })();
  </script>
</body>
</html>
