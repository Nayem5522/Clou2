<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ link_info.filename }}</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/vZNQzMjH/movie.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .content-wrapper {
            width: 100%;
            max-width: 700px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-box, .ads-wrapper, .download-wrapper {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        h3 {
            word-break: break-all;
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        
        .info-box p {
            color: #ddd;
            margin-top: 5px;
            font-size: 1.1rem;
        }

        #timer-countdown {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffc107;
            margin-top: 10px;
        }
        
        .ads-wrapper {
            padding: 15px;
        }
        
        .ad-slot {
            margin: 20px auto;
        }
        
        .download-wrapper {
            display: none;
        }

        .action-btn {
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #28a745, #218838);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(40,167,69,0.4);
            display: inline-block;
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 20px rgba(40,167,69,0.5);
        }

        footer {
            width: 100%;
            color: #ccc;
            font-size: 14px;
            padding: 20px 0;
            margin-top: auto;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="info-box">
            <h3>{{ link_info.filename }}</h3>
            <p><strong>Size:</strong> {{ format_size(link_info.size) }}</p>
            <div id="timer-container">
                <p>Your download link will be ready in:</p>
                <div id="timer-countdown">5</div>
            </div>
        </div>
        <div class="ads-wrapper">
            <div class="ad-slot" id="header-ad-slot">{{ ads.header_ad|safe }}</div>
            <div class="ad-slot" id="details-ad-slot">{{ ads.details_ad|safe }}</div>
            <div class="ad-slot" id="footer-ad-slot">{{ ads.footer_ad|safe }}</div>
        </div>
        <div id="download-wrapper" class="download-wrapper">
            <!-- পরিবর্তন ১: onclick ইভেন্টে একটি নতুন ফাংশন 'startDownload' কল করা হয়েছে -->
            <button class="action-btn" onclick="startDownload('{{ final_download_link }}')">
                ⬇️ Download Now
            </button>
        </div>
    </div>

    <!-- পরিবর্তন ২: কুকি সেট করার জন্য একটি অদৃশ্য iframe যুক্ত করা হয়েছে -->
    <iframe id="downloader" style="display:none;"></iframe>

    <footer>© {{ current_year }} PMWBD - All Rights Reserved</footer>

    <!-- পরিবর্তন ৩: জাভাস্ক্রিপ্ট কোডটি সম্পূর্ণ নতুন করে লেখা হয়েছে -->
    <script>
        window.onload = function() {
            let timer = 5;
            const countdownElement = document.getElementById('timer-countdown');
            const downloadWrapper = document.getElementById('download-wrapper');
            const timerContainer = document.getElementById('timer-container');

            const interval = setInterval(() => {
                timer--;
                countdownElement.textContent = timer;
                if (timer <= 0) {
                    clearInterval(interval);
                    timerContainer.innerHTML = "<p style='font-size: 1.1rem; color: #28a745; font-weight: 600;'>Your link is generated.<br>Scroll down and click on the Download Now button.</p>";
                    downloadWrapper.style.display = 'block';
                }
            }, 1000);
        };

        // নতুন এবং কার্যকরী ডাউনলোড ফাংশন
        function startDownload(url) {
            const button = document.querySelector(".action-btn");
            button.disabled = true;
            button.innerHTML = '<span class="spinner"></span> Preparing...';

            // শুধুমাত্র গুগল ড্রাইভ লিঙ্কের জন্য বিশেষ কৌশল প্রয়োগ করা হবে
            if (url.includes("drive.google.com")) {
                // ধাপ ১: অদৃশ্য iframe ব্যবহার করে ব্যবহারকারীর ব্রাউজারে কুকি সেট করানো
                const iframe = document.getElementById('downloader');
                iframe.src = url;

                // ধাপ ২: এক সেকেন্ড পর মূল ডাউনলোড লিঙ্কটি নতুন ট্যাবে খোলা
                // এই সময়ের মধ্যে কুকি সেট হয়ে যাবে, ফলে সতর্কীকরণ পেজ আসবে না
                setTimeout(() => {
                    // নতুন ট্যাবে লিঙ্কটি খোলা হচ্ছে
                    window.open(url, '_blank');
                    
                    // বাটনটিকে আবার আগের অবস্থায় ফিরিয়ে আনা
                    button.disabled = false;
                    button.innerHTML = "⬇️ Download Now";
                }, 1000); // ১ সেকেন্ড বিলম্বই যথেষ্ট

            } else {
                // অন্যান্য সাধারণ লিঙ্কের জন্য সরাসরি নতুন ট্যাবে খোলা হবে
                window.open(url, '_blank');
                setTimeout(() => {
                    button.disabled = false;
                    button.innerHTML = "⬇️ Download Now";
                }, 1000);
            }
        }
    </script>

</body>
</html>
