<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ link_info.filename }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            margin: 0;
            padding: 0;
        }
        .banner {
            width: 100%;
            max-height: 250px;
            overflow: hidden;
            cursor: pointer;
        }
        .banner img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .banner:hover img {
            transform: scale(1.05);
        }
        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            margin: 30px auto;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        h3 {
            word-break: break-all;
            margin-bottom: 10px;
        }
        p {
            color: #ddd;
            margin-top: 5px;
        }
        .ad-container {
            margin: 20px auto;
            max-width: 728px;
        }
        #timer-ui {
            padding: 20px;
        }
        #timer-countdown {
            font-size: 26px;
            font-weight: bold;
            color: #ff4d4d;
        }
        #success-message {
            display: none;
            padding: 15px;
            background-color: rgba(40,167,69,0.2);
            color: #d4edda;
            border: 1px solid #28a745;
            border-radius: 5px;
            font-weight: bold;
        }
        #button-container {
            display: none;
            margin-top: 25px;
        }
        .action-btn {
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #28a745, #218838);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(40,167,69,0.4);
        }
        .action-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #34ce57, #1e7e34);
        }
        footer {
            color: #ccc;
            font-size: 14px;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- 🔹 Banner image clickable -->
    <div class="banner" onclick="window.open('https://pmwbd.vercel.app', '_blank')">
        <img src="https://i.postimg.cc/3RPyjtvc/IMG-20250817-043812-084.jpg" alt="Banner">
    </div>

    <div class="ad-container" id="header-ad">{{ ads.header_ad|safe }}</div>

    <div class="box">
        <h3>📦 {{ link_info.filename }}</h3>
        <p>Size: {{ format_size(link_info.size) }}</p>
        <div class="ad-container" id="details-ad">{{ ads.details_ad|safe }}</div>

        <div id="timer-ui">
            <p>Your link will be ready in:</p>
            <div id="timer-countdown">5</div>
        </div>

        <div id="success-message">✅ Your link is generated!</div>

        <div id="button-container">
            <!-- ⬇️ Download Button -->
            <button class="action-btn" onclick="openInNewTab('{{ final_download_link }}')">
                ⬇️ Download Now
            </button>
        </div>
    </div>

    <div class="ad-container" id="footer-ad">{{ ads.footer_ad|safe }}</div>

    <footer>© {{ current_year }} PMWBD - All Rights Reserved</footer>

    <script>
        // Countdown timer
        window.onload = function() {
            let timer = 5;
            const countdownElement = document.getElementById('timer-countdown');
            const timerUi = document.getElementById('timer-ui');
            const successMessage = document.getElementById('success-message');
            const buttonContainer = document.getElementById('button-container');

            const interval = setInterval(() => {
                timer--;
                countdownElement.textContent = timer;
                if (timer <= 0) {
                    clearInterval(interval);
                    timerUi.style.display = 'none';
                    successMessage.style.display = 'block';
                    buttonContainer.style.display = 'block';
                }
            }, 1000);
        };

        // 🔗 Force open link in a new tab
        function openInNewTab(url) {
            const newTab = window.open('about:blank', '_blank');
            if (newTab) {
                newTab.location.href = url;
            } else {
                alert('Please allow popups for this site to open your download link.');
            }
        }
    </script>

</body>
</html>
<!-- END OF FILE server/templates/file.html -->
