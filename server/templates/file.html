<!DOCTYPE html>
<html>
<head>
    <title>{{ link_info.filename }}</title>
    <style>
        body { text-align:center; font-family:sans-serif; background:#f4f4f4; padding:50px; }
        .box { background:white; padding:30px; border-radius:10px; display:inline-block; box-shadow:0 0 10px rgba(0,0,0,0.1); }
        .download-btn { background:#28a745; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-size: 16px; text-decoration: none; }
        .download-btn:hover { background:#218838; }
        h3 { word-break: break-all; }
    </style>
</head>
<body>
    <div class="box">
        <h3>📦 {{ link_info.filename }}</h3>
        <p>Size: {{ format_size(link_info.size) }}</p>
        <!-- The button now directly links to the download -->
        <a href="/direct/{{ link_id }}" class="download-btn">⬇️ Download</a>
    </div>
</body>
</html>
<!-- END OF FILE server/templates/file.html -->
