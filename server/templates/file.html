<!DOCTYPE html>
<html>
<head>
    <title>{{ link_info.filename }}</title>
    <style>
        body { text-align:center; font-family:sans-serif; background:#f4f4f4; padding:50px; }
        .box { background:white; padding:30px; border-radius:10px; display:inline-block; box-shadow:0 0 10px rgba(0,0,0,0.1); min-width: 300px; }
        button { background:#28a745; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-size: 16px; text-decoration: none; display: inline-block; }
        button:hover { background:#218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        h3 { word-break: break-all; }
        
        /* --- CHANGE 2: Styles for the new waiting UI --- */
        #waiting-ui { display: none; padding: 20px; }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status-text { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="box">
        <h3>📦 {{ link_info.filename }}</h3>
        
        <!-- The main download button -->
        <div id="download-ui">
            <p>Size: {{ format_size(link_info.size) }}</p>
            <button id="download-btn">⬇️ Download</button>
        </div>

        <!-- The waiting UI, hidden by default -->
        <div id="waiting-ui">
            <div class="loader"></div>
            <p id="status-text">Checking server status...</p>
            <small>Please wait, your download will start automatically.</small>
        </div>
    </div>

    <script>
        const downloadBtn = document.getElementById('download-btn');
        const downloadUi = document.getElementById('download-ui');
        const waitingUi = document.getElementById('waiting-ui');
        const statusText = document.getElementById('status-text');
        const linkId = "{{ link_id }}";
        const serverLimit = "{{ limit }}";

        let statusInterval;

        downloadBtn.addEventListener('click', startDownloadProcess);

        function startDownloadProcess() {
            // Disable button and show waiting UI
            downloadBtn.disabled = true;
            downloadUi.style.display = 'none';
            waitingUi.style.display = 'block';

            // Start polling the server status
            checkStatus();
            statusInterval = setInterval(checkStatus, 3000); // Check every 3 seconds
        }

        function checkStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ready') {
                        // Server is ready, stop polling and start download
                        clearInterval(statusInterval);
                        statusText.textContent = "✅ Server is ready! Starting your download...";
                        statusText.style.color = 'green';
                        // Redirect to the direct download link to trigger the download
                        window.location.href = `/direct/${linkId}`;
                        
                        // After a short delay, hide the waiting UI in case the user stays on the page
                        setTimeout(() => {
                           waitingUi.style.display = 'none';
                           downloadUi.style.display = 'block';
                           downloadBtn.disabled = false;
                        }, 5000);

                    } else {
                        // Server is busy, update the status message
                        statusText.textContent = `Server is busy... (${data.active}/${data.limit} downloads running)`;
                        statusText.style.color = '#dc3545';
                    }
                })
                .catch(error => {
                    clearInterval(statusInterval);
                    statusText.textContent = '⚠️ Could not connect to server. Please try again.';
                    console.error('Error polling status:', error);
                });
        }
    </script>
</body>
</html>
<!-- END OF FILE server/templates/file.html -->
