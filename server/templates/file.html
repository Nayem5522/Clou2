<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ link_info.filename }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .content-wrapper {
            width: 100%;
            max-width: 700px; /* Adjust max-width as needed */
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-box, .ads-wrapper, .download-wrapper {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        h3 {
            word-break: break-all;
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        
        .info-box p {
            color: #ddd;
            margin-top: 5px;
            font-size: 1.1rem;
        }

        #timer-countdown {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffc107; /* A brighter color for the timer */
            margin-top: 10px;
        }
        
        .ads-wrapper {
            padding: 15px; /* Less padding for ad container */
        }
        
        .ad-slot {
            margin: 20px auto; /* Space between ads */
        }
        
        .download-wrapper {
            display: none; /* Hidden by default */
        }

        .action-btn {
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #28a745, #218838);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(40,167,69,0.4);
            display: inline-block;
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 20px rgba(40,167,69,0.5);
        }

        footer {
            width: 100%;
            color: #ccc;
            font-size: 14px;
            padding: 20px 0;
            margin-top: auto; /* Pushes footer to the bottom */
        }
    </style>
</head>
<body>

    <div class="content-wrapper">

        <!-- ### BOX 1: File Info and Countdown Timer ### -->
        <div class="info-box">
            <h3>{{ link_info.filename }}</h3>
            <p><strong>Size:</strong> {{ format_size(link_info.size) }}</p>
            <p>Your download link will be ready in:</p>
            <div id="timer-countdown">5</div>
        </div>

        <!-- ### BOX 2: All Advertisements Together ### -->
        <div class="ads-wrapper">
            <div class="ad-slot" id="header-ad-slot">{{ ads.header_ad|safe }}</div>
            <div class="ad-slot" id="details-ad-slot">{{ ads.details_ad|safe }}</div>
            <div class="ad-slot" id="footer-ad-slot">{{ ads.footer_ad|safe }}</div>
        </div>

        <!-- ### BOX 3: Download Button (Initially Hidden) ### -->
        <div id="download-wrapper" class="download-wrapper">
            <a href="{{ final_download_link }}" class="action-btn">
                ⬇️ Download Now
            </a>
        </div>
        
    </div>

    <footer>© {{ current_year }} PMWBD - All Rights Reserved</footer>

    <script>
        window.onload = function() {
            let timer = 5;
            const countdownElement = document.getElementById('timer-countdown');
            const downloadWrapper = document.getElementById('download-wrapper');

            const interval = setInterval(() => {
                timer--;
                countdownElement.textContent = timer;
                if (timer <= 0) {
                    clearInterval(interval);
                    // Hide the timer
                    countdownElement.parentElement.innerHTML = "<p style='font-size: 1.2rem; color: #28a745; font-weight: 600;'>✅ Your link is ready!</p>";
                    // Show the download button container
                    downloadWrapper.style.display = 'block';
                }
            }, 1000);
        };
    </script>

</body>
</html>
<!-- END OF FILE server/templates/file.html -->
